name: Auto-Merge Crowdin PRs

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR Number to merge (e.g., 9)'
        required: true
        type: string
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  enable-automerge:
    runs-on: ubuntu-latest
    steps:
      - name: Enable GitHub Auto-Merge
        run: gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --auto --merge
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
